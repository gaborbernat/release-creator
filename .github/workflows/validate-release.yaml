name: Validate release
on:
  workflow_call:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.15"
          cache-dependency-glob: "pyproject.toml"
          enable-cache: false
      - name: Assemble and validate a local release
        if: github.event_name == 'pull_request'
        id: fixture
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git checkout -B release-validation "$BASE_SHA"
          git merge --squash "$HEAD_SHA"
          printf 'Validate the release pipeline on this pull request.\n' >"changelog.d/+validation-${PR_NUMBER}.bugfix.md"
          git add -A
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com commit -m "Validate release pipeline (#${PR_NUMBER})"
          version=$(git tag --list | uv run --no-default-groups release-creator tags --next auto)
          git tag --list | uv run --no-default-groups release-creator tags "$version" --require-newer
          uv run --no-default-groups release-creator fragments --repository "$GITHUB_REPOSITORY" --git --resolve-authors
          uv run --no-default-groups --group release towncrier build --yes --version "$version"
          uvx prek exec mdformat -- mdformat --wrap 120 docs/changelog.md
          uvx prek run --all-files
          git diff HEAD --binary >"$RUNNER_TEMP/release.patch"
          test -s "$RUNNER_TEMP/release.patch"
          git reset --hard HEAD
          git apply --check "$RUNNER_TEMP/release.patch"
          git apply --index "$RUNNER_TEMP/release.patch"
          while IFS= read -r path; do
            case "$path" in
              docs/changelog.md | changelog.d/*.md) ;;
              *)
                echo "::error::unexpected release path: $path"
                exit 1
                ;;
            esac
          done < <(git diff --cached --name-only)
          grep -Fq "## $version (" docs/changelog.md
          git diff --cached --check
          uvx prek run --all-files
          if ! git diff --quiet || [[ -n $(git ls-files --others --exclude-standard) ]]; then
            echo "::error::prek changed the validated release patch; inspect the generated changelog and rerun"
            exit 1
          fi
          git -c user.name=release-validation -c user.email=release-validation@users.noreply.github.com commit -m "release $version"
          git tag "$version"
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Require a changelog section for the tag
        env:
          TAG: ${{ steps.fixture.outputs.version || github.ref_name }}
        run: |
          uv run --no-default-groups release-creator tags "$TAG"
          if ! grep -qF "## $TAG (" docs/changelog.md; then
            echo "::error::docs/changelog.md has no section for $TAG"
            exit 1
          fi
          uv run --no-default-groups release-creator notes --changelog docs/changelog.md --tag "$TAG" --repository "$GITHUB_REPOSITORY" >/dev/null
      - name: Check the tagged source
        run: uvx prek run --all-files
      - name: Build package
        run: uv build --python 3.15 --python-preference only-managed --sdist --wheel . --out-dir dist
      - name: Prepare contributor fixture
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          printf '* Validate release pipeline by @%s in https://github.com/%s/pull/%s\n' \
            "$PR_AUTHOR" "$GITHUB_REPOSITORY" "$PR_NUMBER" >"$RUNNER_TEMP/generated-notes.md"
      - name: Render release notes
        env:
          TAG: ${{ steps.fixture.outputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          previous=$(git tag --list | uv run --no-default-groups release-creator tags "$TAG" --previous)
          args=()
          if [[ -n "$previous" ]]; then
            args+=(--previous "$previous")
          fi
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            args+=(--generated-notes "$RUNNER_TEMP/generated-notes.md")
          fi
          uv run --no-default-groups release-creator notes --changelog docs/changelog.md --tag "$TAG" --repository "$GITHUB_REPOSITORY" --artifact-url "https://pypi.org/project/release-creator/${TAG}/" "${args[@]}" >"$RUNNER_TEMP/release-notes.md"
      - name: Inspect candidate artifacts
        if: github.event_name == 'pull_request'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
        run: |
          set -euo pipefail
          test "$(grep -c '^\*\*Full Changelog\*\*:' "$RUNNER_TEMP/release-notes.md")" -eq 1
          grep -Fq "[#${PR_NUMBER}](https://github.com/${GITHUB_REPOSITORY}/pull/${PR_NUMBER})" "$RUNNER_TEMP/release-notes.md"
          if [[ "$PR_AUTHOR_TYPE" == Bot ]]; then
            if grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"; then
              exit 1
            fi
          else
            grep -Fq "by @${PR_AUTHOR}" "$RUNNER_TEMP/release-notes.md"
          fi
          sha256sum dist/* >"$RUNNER_TEMP/dist.sha256"
          cp docs/changelog.md "$RUNNER_TEMP/changelog.md"
      - name: Store the distribution packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: dist/*
          if-no-files-found: error
      - name: Store release notes
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
      - name: Store rehearsal evidence
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: |
            ${{ runner.temp }}/release.patch
            ${{ runner.temp }}/release-notes.md
            ${{ runner.temp }}/changelog.md
            ${{ runner.temp }}/dist.sha256
            dist/*
          if-no-files-found: error
